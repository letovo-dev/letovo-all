name: Mac builder CI request

on:
  pull_request:
    branches: [main]
    paths:
      - src/backend-builder.env
      - src/Dockerfile.builder
  push:
    branches: [main]
    paths:
      - src/backend-builder.env
      - src/Dockerfile.builder

permissions:
  contents: read

jobs:
  complete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Trusted controller will verify this frozen builder source."
